name: Hourly Zendesk Snapshot Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

concurrency:
  group: supportcenter-zendesk-single-pass
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Run one snapshot pass
        env:
          CRON_SECRET: ${{ secrets.SUPPORTCENTER_CRON_SECRET }}
          BASE_URL: https://supportcenter-kappa.vercel.app
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --max-time 300 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/zendesk-hourly-sync"
