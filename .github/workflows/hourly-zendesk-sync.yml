name: Hourly Zendesk Snapshot Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync staged Zendesk snapshot
        env:
          CRON_SECRET: ${{ secrets.SUPPORTCENTER_CRON_SECRET }}
          BASE_URL: https://supportcenter-kappa.vercel.app
        shell: bash
        run: |
          set -euo pipefail

          call_stage () {
            local workspace="$1"
            local stage="$2"
            local cursor="${3:-}"

            local url="$BASE_URL/api/zendesk-hourly-sync?workspace=$workspace&stage=$stage"

            if [ -n "$cursor" ]; then
              local encoded
              encoded=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$cursor")
              url="$url&cursor=$encoded"
            fi

            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$url"
          }

          for workspace in atomos angelbird; do
            echo "Workspace: $workspace"

            call_stage "$workspace" reference | tee /tmp/result.json
            sleep 2

            call_stage "$workspace" satisfaction | tee /tmp/result.json
            sleep 2

            call_stage "$workspace" metrics | tee /tmp/result.json
            sleep 2

            for stage in tickets metric-events; do
              cursor=""
              for i in $(seq 1 50); do
                echo "$workspace / $stage chunk $i"

                if [ -n "$cursor" ]; then
                  call_stage "$workspace" "$stage" "$cursor" | tee /tmp/result.json
                else
                  call_stage "$workspace" "$stage" | tee /tmp/result.json
                fi

                done_flag=$(jq -r '.done // false' /tmp/result.json)
                cursor=$(jq -r '.next // empty' /tmp/result.json)

                if [ "$done_flag" = "true" ] || [ -z "$cursor" ]; then
                  break
                fi

                sleep 2
              done
            done
          done
