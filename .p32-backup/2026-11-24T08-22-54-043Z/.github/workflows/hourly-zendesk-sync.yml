name: Hourly Zendesk Snapshot Sync

on:
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force a full Zendesk resync even if already fresh'
        required: false
        type: boolean
        default: false
  schedule:
    # Two off-peak attempts per hour; the status guard avoids duplicate imports.
    - cron: '17 * * * *'
    - cron: '47 * * * *'

permissions:
  contents: read

concurrency:
  group: supportcenter-zendesk-snapshot-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BASE_URL: https://supportcenter-kappa.vercel.app
      CRON_SECRET: ${{ secrets.SUPPORTCENTER_CRON_SECRET }}
      SUPPORTCENTER_DATABASE_URL: ${{ secrets.SUPPORTCENTER_DATABASE_URL }}
      # GitHub repository variable may be set to "atomos angelbird" after
      # Angelbird credentials are configured on Vercel.
      SYNC_WORKSPACES: ${{ vars.SUPPORTCENTER_SYNC_WORKSPACES || 'atomos' }}
      FORCE_SYNC: ${{ inputs.force_sync || 'false' }}
    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET" || { echo 'Missing SUPPORTCENTER_CRON_SECRET'; exit 1; }
          test -n "$SUPPORTCENTER_DATABASE_URL" || { echo 'Missing SUPPORTCENTER_DATABASE_URL (one-time GitHub secret setup)'; exit 1; }
          for workspace in $SYNC_WORKSPACES; do
            [[ "$workspace" == 'atomos' || "$workspace" == 'angelbird' ]] || {
              echo "Invalid workspace: $workspace"; exit 1;
            }
          done

      - name: Checkout trusted main branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install PostgreSQL publisher dependencies
        shell: bash
        run: npm ci --prefix backend --omit=dev --no-audit --no-fund
      # P31_CA_PREFLIGHT: validate the same pinned CA used by Windows before any Zendesk import.
      - name: Verify Supabase TLS certificate (fail before import)
        shell: bash
        env:
          SUPPORTCENTER_SUPABASE_CA_PEM: ${{ secrets.SUPPORTCENTER_SUPABASE_CA_PEM }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPPORTCENTER_SUPABASE_CA_PEM:-}" ]]; then
            echo 'P31_CA_SECRET_MISSING: set SUPPORTCENTER_SUPABASE_CA_PEM'; exit 1
          fi
          ca_path="$RUNNER_TEMP/supportcenter-supabase-ca.pem"
          printf '%s\n' "$SUPPORTCENTER_SUPABASE_CA_PEM" > "$ca_path"
          chmod 600 "$ca_path"
          openssl x509 -in "$ca_path" -noout >/dev/null || { echo 'P31_CA_INVALID_PEM'; exit 1; }
          echo "NODE_EXTRA_CA_CERTS=$ca_path" >> "$GITHUB_ENV"
          NODE_EXTRA_CA_CERTS="$ca_path" node <<'NODE'
          const {Client}=require('./backend/node_modules/pg');
          (async()=>{
            const raw=process.env.SUPPORTCENTER_DATABASE_URL;
            if(!raw)throw Error('DATABASE_URL_MISSING');
            const u=new URL(raw);
            u.searchParams.delete('sslmode');
            u.searchParams.delete('uselibpqcompat');
            const c=new Client({connectionString:u.toString(),ssl:{rejectUnauthorized:true},connectionTimeoutMillis:20000});
            c.on('error',()=>{});
            try{await c.connect();await c.query('SELECT 1 AS ok');console.log('P31_GITHUB_DATABASE_TLS_PASS')}
            finally{await c.end().catch(()=>{})}
          })().catch(e=>{
            const msg=String(e.message||e).replace(/postgres(?:ql)?:\/\/\S+/gi,'[REDACTED]');
            console.error('P31_GITHUB_DATABASE_TLS_FAIL',msg.slice(0,220));process.exit(1);
          });
          NODE
      - name: Sync staged Zendesk snapshots
        shell: bash
        run: |
          set -euo pipefail
          call_stage() {
            local workspace="$1" stage="$2" cursor="${3:-}"
            local result
            if [[ -n "$cursor" ]]; then
              result=$(curl --fail-with-body --silent --show-error \
                --connect-timeout 20 --max-time 240 \
                --retry 2 --retry-delay 5 --retry-all-errors \
                -H "Authorization: Bearer $CRON_SECRET" \
                --get --data-urlencode "workspace=$workspace" \
                --data-urlencode "stage=$stage" \
                --data-urlencode "cursor=$cursor" \
                "$BASE_URL/api/zendesk-hourly-sync")
            else
              result=$(curl --fail-with-body --silent --show-error \
                --connect-timeout 20 --max-time 240 \
                --retry 2 --retry-delay 5 --retry-all-errors \
                -H "Authorization: Bearer $CRON_SECRET" \
                --get --data-urlencode "workspace=$workspace" \
                --data-urlencode "stage=$stage" \
                "$BASE_URL/api/zendesk-hourly-sync")
            fi
            # A 200 with skipped=true is NOT a successful sync.
            echo "$result" | jq -e '.ok == true and .skipped != true and .workspace != null' >/dev/null || {
              echo "Invalid/skipped sync response for $workspace/$stage"; exit 1;
            }
            echo "$result" | jq -c '{workspace,stage,done,count,remaining,counts}'
            printf '%s\n' "$result" >/tmp/supportcenter-sync-stage.json
          }
          for workspace in $SYNC_WORKSPACES; do
            echo "=== Workspace: $workspace ==="
            # P31_GITHUB_PUBLISHER: skip recent complete reports, repair a partial
            # publication without fetching Zendesk again when source is fresh.
            if [[ "${FORCE_SYNC:-false}" != "true" ]]; then
              status_json=$(curl --fail-with-body --silent --show-error \
                --connect-timeout 10 --max-time 35 \
                -H "Authorization: Bearer $CRON_SECRET" \
                --get --data-urlencode "workspace=$workspace" --data-urlencode 'stage=status' \
                "$BASE_URL/api/zendesk-hourly-sync" 2>/dev/null || true)
              if printf '%s' "$status_json" | jq -e \
                '.ok == true and .periodsReady == true and (.ageSeconds | type == "number") and .ageSeconds >= 0 and .ageSeconds < 2700' >/dev/null 2>&1; then
                echo "P31_FRESH_COMPLETE_SKIP workspace=$workspace"; continue
              fi
              if printf '%s' "$status_json" | jq -e \
                '.ok == true and .periodsReady == false and (.sourceAgeSeconds | type == "number") and .sourceAgeSeconds >= 0 and .sourceAgeSeconds < 2700' >/dev/null 2>&1; then
                echo "P31_REPAIR_PUBLISH_ONLY workspace=$workspace"
                node backend/tools/p31-publish-periods.cjs --workspace "$workspace"
                continue
              fi
            fi
            for stage in reference satisfaction metrics; do
              call_stage "$workspace" "$stage"
              jq -e '.done == true' /tmp/supportcenter-sync-stage.json >/dev/null || {
                echo "$workspace/$stage did not finish"; exit 1;
              }
              sleep 2
            done
            for stage in tickets metric-events; do
              cursor=''
              finished=false
              for i in $(seq 1 250); do
                echo "$workspace/$stage chunk $i"
                call_stage "$workspace" "$stage" "$cursor"
                if jq -e '.done == true' /tmp/supportcenter-sync-stage.json >/dev/null; then
                  finished=true; break
                fi
                cursor=$(jq -r '.next // empty' /tmp/supportcenter-sync-stage.json)
                [[ -n "$cursor" ]] || { echo "Missing next cursor for $workspace/$stage"; exit 1; }
                sleep 2
              done
              [[ "$finished" == true ]] || { echo "$workspace/$stage exhausted chunk limit"; exit 1; }
            done
            # Pre-cache latest 80 ticket conversations; details for other
            # tickets are loaded on demand by the authenticated backend.
            finished=false
            for i in $(seq 1 30); do
              call_stage "$workspace" conversations
              if jq -e '.done == true' /tmp/supportcenter-sync-stage.json >/dev/null; then
                finished=true; break
              fi
              sleep 2
            done
            [[ "$finished" == true ]] || { echo "$workspace/conversations exceeded batch cap"; exit 1; }
            # Publish ONLY after every staged import and conversation stage completed.
            # Last published mobile report remains unchanged during this import.
            call_stage "$workspace" publish
            jq -e '.done == true' /tmp/supportcenter-sync-stage.json >/dev/null || {
              echo "$workspace/publish failed"; exit 1;
            }
            # P31 worker is independent of Vercel function execution limits.
            # All four reports become visible together at pointer activation.
            node backend/tools/p31-publish-periods.cjs --workspace "$workspace"
            echo "=== Completed: $workspace ==="
          done
